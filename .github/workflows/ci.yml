name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies and Lint
        run: |
          pip install flake8
          flake8 producer/producer.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 consumer/consumer.py --count --select=E9,F63,F7,F82 --show-source --statistics

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-rabbitmq-producer ./producer
          docker build -t my-rabbitmq-consumer ./consumer
